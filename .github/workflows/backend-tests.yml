name: backend-tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # httpx: usado pelo TestClient do FastAPI nos testes (<0.28 por causa do starlette 0.38)
      - run: pip install -r requirements.txt pytest "httpx<0.28"
      - run: python -m pytest
