# Nginx interno do container "web": serve o frontend e encaminha /api/ ao backend.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1024m;

    location /api/ {
        # Alias exclusivo: "backend" colide com outros containers quando o web entra na rede do Caddy.
        proxy_pass http://orbitbase-api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Processamentos VRS podem levar vários minutos numa única requisição.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
